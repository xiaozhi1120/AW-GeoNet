# AW-GeoNet: geometry-aware detector built on a YOLOv8s skeleton.
#
# Paper components -> module positions (global layer indices):
#   GAMS      (MSBlock)        : layer 4   (backbone, P3 stage)
#   DPS-Conv  (GSConv)         : layers 10, 14, 18, 21 (neck)
#   GPDA      (DeformableC2f)  : layers 17, 20 (neck, detection levels P3/P4)
#
# `n` in the second column is scaled by depth_multiple (0.33), so
#   6 -> 2 and 3 -> 1 repeated blocks.

nc: 7
names: ['pedestrian', 'rider', 'car', 'truck', 'bus', 'rare_vehicle', 'traffic_device']

depth_multiple: 0.33
width_multiple: 0.50

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                        # 0  P1/2
  - [-1, 1, Conv, [128, 3, 2]]                       # 1  P2/4
  - [-1, 3, C2f, [128, True]]                        # 2
  - [-1, 1, Conv, [256, 3, 2]]                       # 3  P3/8
  - [-1, 6, MSBlock, [256, 1, [3, 5, 7], True, "medium"]]  # 4  GAMS
  - [-1, 1, Conv, [512, 3, 2]]                       # 5  P4/16
  - [-1, 6, C2f, [512, True]]                        # 6
  - [-1, 1, Conv, [1024, 3, 2]]                      # 7  P5/32
  - [-1, 3, C2f, [1024, True]]                       # 8
  - [-1, 1, SPPF, [1024, 5]]                         # 9

head:
  - [-1, 1, GSConv, [512, 1, 1]]                     # 10 DPS-Conv
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 11
  - [[-1, 6], 1, Concat, [1]]                        # 12
  - [-1, 3, C2f, [512, False]]                       # 13

  - [-1, 1, GSConv, [256, 1, 1]]                     # 14 DPS-Conv
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 15
  - [[-1, 4], 1, Concat, [1]]                        # 16
  - [-1, 3, DeformableC2f, [256, 1, False]]          # 17 GPDA (P3)

  - [-1, 1, GSConv, [256, 3, 2]]                     # 18 DPS-Conv
  - [[-1, 13], 1, Concat, [1]]                       # 19
  - [-1, 3, DeformableC2f, [512, 1, False]]          # 20 GPDA (P4)

  - [-1, 1, GSConv, [512, 3, 2]]                     # 21 DPS-Conv
  - [[-1, 9], 1, Concat, [1]]                        # 22
  - [-1, 1, C2f, [1024, False]]                      # 23 plain C2f (P5)

  - [[17, 20, 23], 1, Detect, [nc]]                  # 24
